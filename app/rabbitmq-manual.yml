
apiVersion: v1
kind: Namespace
metadata:
  name: infra
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: infra
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: admin
  RABBITMQ_DEFAULT_PASS: admin
  RABBITMQ_DEFAULT_VHOST: /
  RABBITMQ_ERLANG_COOKIE: super-secret-cookie-change-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: infra
  labels: { app: rabbitmq }
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.0-management
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: RABBITMQ_DEFAULT_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: RABBITMQ_DEFAULT_PASS } }
            - name: RABBITMQ_DEFAULT_VHOST
              valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: RABBITMQ_DEFAULT_VHOST } }
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: RABBITMQ_ERLANG_COOKIE } }
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
      volumes:
        - name: rabbitmq-data
          emptyDir: {}   # для простоты. Нужна сохранность — скажи, дам вариант с PVC.
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: infra
  labels: { app: rabbitmq }
spec:
  type: ClusterIP
  selector: { app: rabbitmq }
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672