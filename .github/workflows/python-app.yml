name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r services/gateway/requirements.txt 2>/dev/null || true
          pip install -r services/book-service/requirements.txt 2>/dev/null || true
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Build Docker image (gateway)
        run: docker build -t gateway:ci -f services/gateway/Dockerfile services/gateway

      - name: Build Docker image (book-service)
        run: docker build -t book-service:ci -f services/book-service/Dockerfile services/book-service
