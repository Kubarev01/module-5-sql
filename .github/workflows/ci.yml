name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  test:
    name: Install & Pytest
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/app:${{ github.workspace }}
      DATABASE_URL: sqlite+aiosqlite:///./ci.db

      # Полностью вырубаем OTel в CI
      OTEL_SDK_DISABLED: "true"
      OTEL_TRACES_EXPORTER: "none"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: "all"

      # Глушилки именно для вашего кода с Zipkin:
      ZIPKIN_HOST: ""                       # чтобы не подставлялся default 'zipkin'
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: ""     # даже если создадут экспортер — без endpoint
      OTEL_EXPORTER_ZIPKIN_PROTOCOL: "http/json"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps (project + fallbacks)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          [[ -f requirements.txt ]] && pip install -r requirements.txt || true
          [[ -f requirements-dev.txt ]] && pip install -r requirements-dev.txt || true
          [[ -f app/requirements.txt ]] && pip install -r app/requirements.txt || true
          [[ -f services/gateway/requirements.txt ]] && pip install -r services/gateway/requirements.txt || true
          [[ -f services/book-service/requirements.txt ]] && pip install -r services/book-service/requirements.txt || true

          # минимальный набор для тестов
          pip install \
            fastapi \
            httpx \
            "sqlalchemy>=2" \
            pydantic \
            uvicorn \
            pytest \
            pytest-asyncio \
            starlette \
            anyio \
            aiosqlite

      - name: Run pytest
        run: pytest -q app/tests

  build:
    name: Build Docker images
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ["gateway", "book-service"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (skip if Dockerfile missing)
        if: ${{ hashFiles(format('services/{0}/Dockerfile', matrix.service)) != '' }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: |
            ${{ github.repository }}:${{ matrix.service }}-ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max