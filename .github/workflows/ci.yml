name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    name: Install & Pytest
    runs-on: ubuntu-latest
    env:
      # чтобы import services.* из каталога app сработал
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/app
      # чтобы код, ожидающий DATABASE_URL, не падал на CI
      DATABASE_URL: sqlite+aiosqlite:///./test.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # если есть ваши requirements — установим
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          [ -f app/requirements.txt ] && pip install -r app/requirements.txt || true
          [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt || true
          [ -f services/gateway/requirements.txt ] && pip install -r services/gateway/requirements.txt || true
          [ -f services/book-service/requirements.txt ] && pip install -r services/book-service/requirements.txt || true
          # гарантированный набор для тестов
          pip install "fastapi>=0.110" "httpx>=0.24" "sqlalchemy>=2.0" "pydantic>=2" uvicorn pytest pytest-asyncio aiosqlite
          python - <<'PY'
          import sys
          print("Python:", sys.version)
          import fastapi, httpx, sqlalchemy
          print("Deps OK: fastapi", fastapi.__version__, "| httpx", httpx.__version__, "| sqlalchemy", sqlalchemy.__version__)
          PY

      - name: Run pytest
        run: pytest -q app/tests

  build:
    name: Build Docker images
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, book-service]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (if Dockerfile exists)
        if: ${{ hashFiles(format('services/{0}/Dockerfile', matrix.service)) != '' }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ github.repository }}:${{ matrix.service }}-ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max