name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  test:
    name: Install & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        shell: bash
        run: |
          set -eux
          python -m pip install --upgrade pip setuptools wheel
          # базовый набор, чтобы не было ModuleNotFoundError
          pip install -U pytest pytest-asyncio fastapi httpx sqlalchemy "pydantic>=2" uvicorn aiosqlite
          # если есть ваши файлы зависимостей — тоже поставим
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          [ -f app/requirements.txt ] && pip install -r app/requirements.txt || true
          [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt || true
          [ -f services/gateway/requirements.txt ] && pip install -r services/gateway/requirements.txt || true
          [ -f services/book-service/requirements.txt ] && pip install -r services/book-service/requirements.txt || true

      - name: Sanity check imports
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, sys
          mods = ["httpx","sqlalchemy","fastapi","pytest"]
          missing = [m for m in mods if importlib.util.find_spec(m) is None]
          print("Missing:", missing)
          sys.exit(1 if missing else 0)
          PY

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/app
          DATABASE_URL: sqlite+aiosqlite:///./test.db
        run: |
          python -c "import os; print('PYTHONPATH=', os.environ['PYTHONPATH'])"
          pytest -q app/tests

  build:
    name: Build Docker images
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ "gateway", "book-service" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (if Dockerfile exists)
        if: ${{ hashFiles(format('services/{0}/Dockerfile', matrix.service)) != '' }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ github.repository }}:${{ matrix.service }}-ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max