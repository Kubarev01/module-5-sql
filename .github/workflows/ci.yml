name: CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  test:
    name: Install & Pytest
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f services/gateway/requirements.txt ]; then pip install -r services/gateway/requirements.txt; fi
          if [ -f services/book-service/requirements.txt ]; then pip install -r services/book-service/requirements.txt; fi
          # fallback-пакеты, чтобы точно прошла коллекция тестов
          pip install -q fastapi httpx sqlalchemy pydantic uvicorn pytest pytest-asyncio

      - name: Run pytest
        run: pytest -q app/tests

  build:
    name: Build Docker images
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, book-service]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (if Dockerfile exists)
        if: ${{ hashFiles(format('services/{0}/Dockerfile', matrix.service)) != '' }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ github.repository }}:${{ matrix.service }}-ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max