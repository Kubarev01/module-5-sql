name: CI

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  test:
    name: Install & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # общий requirements (если есть)
          [[ -f requirements.txt ]] && pip install -r requirements.txt || true
          # дев-зависимости (если есть)
          [[ -f requirements-dev.txt ]] && pip install -r requirements-dev.txt || true
          # зависимости сервисов монорепы (если есть)
          [[ -f services/gateway/requirements.txt ]] && pip install -r services/gateway/requirements.txt || true
          [[ -f services/book-service/requirements.txt ]] && pip install -r services/book-service/requirements.txt || true
          # на всякий случай
          pip install -U pytest

      - name: Run pytest
        run: pytest -q

  build:
    name: Build Docker images
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ "gateway", "book-service" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (skip if Dockerfile missing)
        if: ${{ hashFiles(format('services/{0}/Dockerfile', matrix.service)) != '' }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: |
            ${{ github.repository }}:${{ matrix.service }}-ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max