apiVersion: v1
kind: ConfigMap
metadata:
  name: book-service-config
  namespace: default
data:
  # PostgreSQL (Bitnami)
  POSTGRES_HOST: "postgres-postgresql.infra.svc.cluster.local"
  POSTGRES_DB: "mydatabase"

  # Redis (Bitnami master)
  REDIS_URL: "redis://redis-master.infra.svc.cluster.local:6379/0"

  # Kafka (Strimzi)
  KAFKA_BOOTSTRAP_SERVERS: "my-kafka-kafka-bootstrap.infra.svc.cluster.local:9092"


