allInOne:
  enabled: true

storage:
  type: memory

collector:
  zipkin:
    enabled: true           # <- включаем Zipkin receiver (9411)
  service:
    additionalPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
      - name: otlp-http
        port: 4318
        targetPort: 4318
      - name: zipkin
        port: 9411
        targetPort: 9411