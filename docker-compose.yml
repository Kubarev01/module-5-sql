services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: ./app
    container_name: fastapi_app
    command: uvicorn main:app --app-dir /app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app:cached
    ports:
      - "8000:8000"
    depends_on:
      - kafka
      - db
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql+asyncpg://myuser:mypassword@db:5432/mydatabase
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    restart: on-failure
  
  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    restart: always

  mongodb:
    image: mongo:6
    container_name: mongo_db
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - mongo_data:/data/db
  
  rabbbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  celery_worker:
    build: ./app
    container_name: celery_worker
    command: celery -A delayed_tasks.worker_service.celery_app worker --loglevel=info
    depends_on:
      - rabbbitmq
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbbitmq:5672//
      CELERY_RESULT_BACKEND: rpc://
    restart: always

  celery_beat:
    build: ./app
    container_name: celery_beat
    command: celery -A delayed_tasks.worker_service.celery_app beat --loglevel=info
    depends_on:
      - rabbbitmq
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbbitmq:5672//
      CELERY_RESULT_BACKEND: rpc://
    restart: always
  
  flower:
    build: ./app
    container_name: celery_flower
    command: celery -A delayed_tasks.worker_service.celery_app flower --address=0.0.0.0 --port=5555
    depends_on:
      - rabbbitmq
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbbitmq:5672//
      CELERY_RESULT_BACKEND: rpc://
    restart: always
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  analytics_worker:
    build: ./app
    command: bash -c "sleep 45 && python -m kafka_client.analitics_worker_runner"
    depends_on:
      - kafka
      - mongodb

volumes:
  postgres_data:
  mongo_data: